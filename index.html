<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-Do List</h1>

    <form id="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="Enter a task"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
